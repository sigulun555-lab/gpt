name: Audit lambda 2025 out-of-time and 2026 reproduction
on:
  push:
    branches: [audit/lambda-out-of-time-2025]
    paths:
      - "scripts/audit_lambda_2025_and_2026.js"
      - "scripts/audit_lambda_scipy_2025_and_2026.py"
      - "scripts/compare_lambda_per_match.py"
      - "scripts/p1_2026_experiments.js"
      - "data/team_aliases.json"
      - ".github/workflows/audit-lambda-out-of-time.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/lambda-out-of-time-2025
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download 2025 public schedule data
        run: |
          mkdir -p data
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/k-addtimes/jleague_open_data/main/processed/2025_schedule_with_ids.csv \
            --output data/2025_schedule_with_ids.csv
      - name: Run independent JavaScript L-BFGS audit
        env:
          AUDIT_MAX_ITERATIONS: 2000
        run: node scripts/audit_lambda_2025_and_2026.js | tee lambda-audit-results.json
      - name: Install SciPy for independent optimizer comparison
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run independent SciPy L-BFGS-B audit
        env:
          AUDIT_MAX_ITERATIONS: 2000
        run: python scripts/audit_lambda_scipy_2025_and_2026.py | tee lambda-audit-scipy-results.json
      - name: Compare per-match JS and SciPy diagnostics
        run: python scripts/compare_lambda_per_match.py
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-audit-results
          path: |
            lambda-audit-results.json
            lambda-audit-js-per-match.csv
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-audit-scipy-results
          path: |
            lambda-audit-scipy-results.json
            lambda-audit-scipy-per-match.csv
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-audit-comparison
          path: |
            lambda-audit-per-match-comparison.csv
            lambda-audit-per-match-comparison.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-2026-experiment-results
          path: |
            p1-2026-results.json
            p1-2026-metrics.csv
            p1-2026-per-match.csv
            p1-2026-fit-failures.csv
            p1-2026-console.json
          if-no-files-found: warn
