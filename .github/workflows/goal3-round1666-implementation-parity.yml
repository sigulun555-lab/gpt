name: GOAL3 round1666 implementation parity audit

on:
  pull_request:
    branches:
      - research/goal3-k-penalty-sweep-20261104
    paths:
      - "verification/goal3_independent/inputs/round1666_history_snapshot_2026-10-27.json"
      - "verification/goal3_independent/inputs/round1666_claude_predictions_reference.jsonl"
      - "verification/goal3_independent/vendor/claude_round1666_goal3.py"
      - "verification/goal3_independent/compare_round1666_implementation.py"
      - "verification/goal3_independent/nested_validation.py"
      - "data/team_aliases.json"
      - ".github/workflows/goal3-round1666-implementation-parity.yml"

permissions:
  contents: read

jobs:
  historical-implementation-parity:
    name: Read-only historical implementation parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research PR
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==2.1.3 scipy==1.14.1
      - name: Run round1666 parity audit
        run: |
          python verification/goal3_independent/compare_round1666_implementation.py \
            --out verification/goal3_independent/results/round1666_implementation_parity.json
      - name: Upload read-only parity report
        uses: actions/upload-artifact@v4
        with:
          name: goal3-round1666-implementation-parity-\${{ github.sha }}
          path: verification/goal3_independent/results/round1666_implementation_parity.json
          if-no-files-found: error
          retention-days: 30
