name: Validate totoGOAL3 fixture parser
on:
  push:
    branches: [fix/toto-goal3-fixture-parser]
    paths:
      - 'scripts/auto_pipeline.js'
      - 'tests/test.js'
      - 'data/fixtures.json'
      - '.github/workflows/test-toto-goal3.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/auto_pipeline.js'
      - 'tests/test.js'
      - 'data/fixtures.json'
      - '.github/workflows/test-toto-goal3.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check scripts/auto_pipeline.js
      - name: Run tests
        run: npm test
