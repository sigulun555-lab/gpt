name: P1 2026 model experiments (audit only)
on:
  push:
    branches: [audit/lambda-out-of-time-2025]
    paths:
      - "scripts/p1_2026_experiments.js"
      - "data/history.json"
      - "data/team_aliases.json"
      - ".github/workflows/p1-2026-experiments.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p1:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/lambda-out-of-time-2025
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download 2025 public schedule data
        run: |
          mkdir -p data
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/k-addtimes/jleague_open_data/main/processed/2025_schedule_with_ids.csv \
            --output data/2025_schedule_with_ids.csv
      - name: Run P1 JavaScript walk-forward experiments
        run: node scripts/p1_2026_experiments.js | tee p1-2026-console.json
      - uses: actions/upload-artifact@v4
        with:
          name: p1-2026-experiment-results
          path: |
            p1-2026-results.json
            p1-2026-metrics.csv
            p1-2026-per-match.csv
            p1-2026-fit-failures.csv
            p1-2026-console.json
          if-no-files-found: error
