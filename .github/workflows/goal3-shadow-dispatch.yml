name: GOAL3 Prospective Shadow Dispatch

on:
  workflow_dispatch:
    inputs:
      research_ref:
        description: Research branch whose HEAD must match the pinned commit
        required: true
        type: choice
        options:
          - research/goal3-prospective-shadow-20261104-v2
      confirm_official_fixture_reviewed:
        description: Confirm the current official round, J1/J2/J3, all three fixtures, and deadline were manually checked immediately before dispatch
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: goal3-prospective-shadow-dispatch
  cancel-in-progress: false

env:
  APPROVED_RESEARCH_REF: research/goal3-prospective-shadow-20261104-v2
  APPROVED_RESEARCH_COMMIT: d5f48314159ffff2f8980738fa02d33ddf2a188b
  APPROVED_CODE_LOCK_COMMIT: 93aa6e185e8868bfb1865f68fad2e63f486d58d7
  APPROVED_CODE_LOCK_SOURCE_COMMIT: b53e9a7c7d8ff50c1e2c1fc029cccb6509848b3c
  APPROVED_CODE_LOCK_FILE_SHA256: 60617a077b5a9ef4ec26e96779a1fe16e8df831fdc268b5ca0ec48b0d63379d2
  APPROVED_CODE_LOCK_REVIEWED_AT: 2026-11-05T18:33:03Z
  APPROVED_RUNNER_SHA256: c886d26ca2705042fdbc08d61fd582eafff9506f0357aa94e63eab8f459ec06a
  APPROVED_MODEL_SHA256: cf7ce0b89f2d2c6cfd48f30e1ce72666ad112251121242dbd81b9c467b4bb05d
  APPROVED_SNAPSHOT_PIPELINE_SHA256: 6f2a1929dbf0f68800b69a714865ce2ace7244f7fd8f2ff9e52f64c294dbbafe
  APPROVED_SCORER_SHA256: d4d0fdfdadcc4c63ae8af70bbd03d67d085dd8352cdab00568a09b1e0fd6f460

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate dispatch attestation and selected research ref
        shell: bash
        env:
          REQUESTED_RESEARCH_REF: ${{ inputs.research_ref }}
          FIXTURE_REVIEWED: ${{ inputs.confirm_official_fixture_reviewed }}
        run: |
          set -euo pipefail
          test "$REQUESTED_RESEARCH_REF" = "$APPROVED_RESEARCH_REF"
          if [[ "$FIXTURE_REVIEWED" != "true" ]]; then
            echo "Official fixture review attestation is required." >&2
            exit 1
          fi

      - name: Checkout exact approved research commit
        uses: actions/checkout@v4
        with:
          ref: d5f48314159ffff2f8980738fa02d33ddf2a188b
          fetch-depth: 0

      - name: Verify immutable branch head and approved generation hashes
        shell: bash
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$APPROVED_RESEARCH_REF" | awk '{print $1}')"
          test "$CHECKED_OUT_SHA" = "$APPROVED_RESEARCH_COMMIT"
          test "$REMOTE_SHA" = "$APPROVED_RESEARCH_COMMIT"

          test "$(sha256sum verification/goal3_independent/prospective_shadow.py | awk '{print $1}')" = "$APPROVED_RUNNER_SHA256"
          test "$(sha256sum verification/goal3_independent/nested_validation.py | awk '{print $1}')" = "$APPROVED_MODEL_SHA256"
          test "$(sha256sum scripts/auto_pipeline.js | awk '{print $1}')" = "$APPROVED_SNAPSHOT_PIPELINE_SHA256"

          LOCK_PATH="verification/goal3_independent/REVIEWER_APPROVED_CODE_HASHES_2026-11-06.json"
          LOCK_COMMIT_AT="$(git show -s --format=%cI "$APPROVED_CODE_LOCK_COMMIT")"
          test "$(git log -1 --format=%H "$APPROVED_CODE_LOCK_COMMIT" -- "$LOCK_PATH")" = "$APPROVED_CODE_LOCK_COMMIT"
          test "$(git show "$APPROVED_CODE_LOCK_COMMIT:$LOCK_PATH" | sha256sum | awk '{print $1}')" = "$APPROVED_CODE_LOCK_FILE_SHA256"
          export LOCK_COMMIT_AT
          echo "LOCK_COMMIT_AT=$LOCK_COMMIT_AT" >> "$GITHUB_ENV"
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime

          lock_path = "verification/goal3_independent/REVIEWER_APPROVED_CODE_HASHES_2026-11-06.json"
          lock = json.loads(subprocess.check_output(
              ["git", "show", f"{os.environ['APPROVED_CODE_LOCK_COMMIT']}:{lock_path}"],
              text=True,
          ))
          expected = {
              "runnerSha256": os.environ["APPROVED_RUNNER_SHA256"],
              "modelSha256": os.environ["APPROVED_MODEL_SHA256"],
              "snapshotPipelineSha256": os.environ["APPROVED_SNAPSHOT_PIPELINE_SHA256"],
              "scorerSha256": os.environ["APPROVED_SCORER_SHA256"],
          }
          if lock.get("approvedCodeHashes") != expected:
              raise SystemExit("reviewer lock code hashes do not match dispatch pins")
          if lock.get("codeHashSourceCommit") != os.environ["APPROVED_CODE_LOCK_SOURCE_COMMIT"]:
              raise SystemExit("reviewer lock source commit does not match dispatch pin")
          reviewed = datetime.fromisoformat(lock["reviewedAt"].replace("Z", "+00:00"))
          committed = datetime.fromisoformat(os.environ["LOCK_COMMIT_AT"].replace("Z", "+00:00"))
          source_committed = datetime.fromisoformat(subprocess.check_output(
              ["git", "show", "-s", "--format=%cI", os.environ["APPROVED_CODE_LOCK_SOURCE_COMMIT"]],
              text=True,
          ).strip().replace("Z", "+00:00"))
          if reviewed.isoformat() != os.environ["APPROVED_CODE_LOCK_REVIEWED_AT"].replace("Z", "+00:00"):
              raise SystemExit("reviewedAt does not match dispatch pin")
          if reviewed < source_committed:
              raise SystemExit("reviewer lock review predates the code hash source commit")
          if reviewed > committed:
              raise SystemExit("reviewer lock was not reviewed before its commit")
          for ancestor in (os.environ["APPROVED_RESEARCH_COMMIT"], os.environ["APPROVED_CODE_LOCK_SOURCE_COMMIT"]):
              check = subprocess.run(
                  ["git", "merge-base", "--is-ancestor", ancestor, os.environ["APPROVED_CODE_LOCK_COMMIT"]]
              )
              if check.returncode:
                  raise SystemExit("reviewer source commit is not an ancestor of the lock commit")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Fetch one official GOAL3 and history snapshot into ephemeral runner
        run: node scripts/auto_pipeline.js

      - name: Create paired k=6 and k=10 shadow forecast
        run: |
          mkdir -p artifacts
          python verification/goal3_independent/prospective_shadow.py \
            --history data/history.json \
            --predictions data/predictions.json \
            --aliases data/team_aliases.json \
            --out artifacts/goal3-prospective-shadow.json

      - name: Write immutable dispatch provenance sidecar
        shell: bash
        env:
          FIXTURE_REVIEWED: ${{ inputs.confirm_official_fixture_reviewed }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          def sha(path):
              h = hashlib.sha256()
              with open(path, "rb") as stream:
                  for chunk in iter(lambda: stream.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          forecast_path = Path("artifacts/goal3-prospective-shadow.json")
          forecast = json.loads(forecast_path.read_text(encoding="utf-8"))
          record = {
              "schemaVersion": 1,
              "experiment": "GOAL3_PROSPECTIVE_SHADOW_K6_VS_K10",
              "recordedAt": datetime.now(timezone.utc).isoformat(),
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "workflowRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflowCommitSha": os.environ["GITHUB_SHA"],
              "workflowRef": os.environ["GITHUB_REF"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "requestedResearchRef": os.environ["APPROVED_RESEARCH_REF"],
              "checkedOutResearchCommitSha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "approvedResearchCommitSha": os.environ["APPROVED_RESEARCH_COMMIT"],
              "approvedCodeLockCommitSha": os.environ["APPROVED_CODE_LOCK_COMMIT"],
              "approvedCodeLockCommitAt": os.environ["LOCK_COMMIT_AT"],
              "approvedCodeLockReviewedAt": os.environ["APPROVED_CODE_LOCK_REVIEWED_AT"],
              "approvedCodeLockFileSha256": os.environ["APPROVED_CODE_LOCK_FILE_SHA256"],
              "approvedCodeLockSourceCommitSha": os.environ["APPROVED_CODE_LOCK_SOURCE_COMMIT"],
              "approvedCodeHashes": {
                  "runnerSha256": os.environ["APPROVED_RUNNER_SHA256"],
                  "modelSha256": os.environ["APPROVED_MODEL_SHA256"],
                  "snapshotPipelineSha256": os.environ["APPROVED_SNAPSHOT_PIPELINE_SHA256"],
                  "scorerSha256": os.environ["APPROVED_SCORER_SHA256"],
              },
              "checkedOutGenerationCodeHashes": {
                  "runnerSha256": sha("verification/goal3_independent/prospective_shadow.py"),
                  "modelSha256": sha("verification/goal3_independent/nested_validation.py"),
                  "snapshotPipelineSha256": sha("scripts/auto_pipeline.js"),
              },
              "officialFixtureReviewConfirmed": os.environ["FIXTURE_REVIEWED"] == "true",
              "forecastSha256": sha(forecast_path),
              "forecastRound": forecast.get("round"),
              "forecastTiming": {
                  key: forecast.get(key)
                  for key in ("snapshotAvailableBy", "forecastAsOf", "deadline")
              },
              "forecastInputHashes": forecast.get("inputs", {}),
              "forecastCodeHashes": forecast.get("code", {}),
              "productionImpact": "none",
          }
          if record["checkedOutResearchCommitSha"] != record["approvedResearchCommitSha"]:
              raise SystemExit("checked-out research commit does not match approved commit")
          if record["checkedOutGenerationCodeHashes"] != {
              key: record["approvedCodeHashes"][key]
              for key in ("runnerSha256", "modelSha256", "snapshotPipelineSha256")
          }:
              raise SystemExit("checked-out generation code hashes do not match approved lock")
          Path("artifacts/dispatch-provenance.json").write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Name artifact by round and run
        id: meta
        run: |
          ROUND=$(python -c "import json; print(json.load(open('data/predictions.json'))['round'])")
          echo "round=$ROUND" >> "$GITHUB_OUTPUT"

      - name: Upload immutable research-only artifact and provenance
        uses: actions/upload-artifact@v4
        with:
          name: goal3-shadow-round-${{ steps.meta.outputs.round }}-run-${{ github.run_id }}
          path: |
            artifacts/goal3-prospective-shadow.json
            artifacts/dispatch-provenance.json
          if-no-files-found: error
          retention-days: 90
