name: P1 SciPy failure-fit audit (chunked)
on:
  push:
    branches: [audit/lambda-out-of-time-2025]
    paths:
      - "scripts/p1_scipy_failure_audit.py"
      - "scripts/aggregate_p1_scipy_failure_audit.py"
      - ".github/workflows/p1-scipy-failure-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-chunk:
    name: SciPy fit audit chunk ${{ matrix.chunk }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {chunk: 0, offset: 0}
          - {chunk: 1, offset: 1000}
          - {chunk: 2, offset: 2000}
          - {chunk: 3, offset: 3000}
          - {chunk: 4, offset: 4000}
          - {chunk: 5, offset: 5000}
          - {chunk: 6, offset: 6000}
          - {chunk: 7, offset: 7000}
          - {chunk: 8, offset: 8000}
          - {chunk: 9, offset: 9000}
          - {chunk: 10, offset: 10000}
          - {chunk: 11, offset: 11000}
          - {chunk: 12, offset: 12000}
          - {chunk: 13, offset: 13000}
          - {chunk: 14, offset: 14000}
          - {chunk: 15, offset: 15000}
          - {chunk: 16, offset: 16000}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/lambda-out-of-time-2025
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: p1-2026-experiment-results
          run-id: 40518879108
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Install SciPy reference optimizer
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Download 2025 public schedule data
        run: |
          mkdir -p data
          curl --fail --location --retry 3 https://raw.githubusercontent.com/k-addtimes/jleague_open_data/main/processed/2025_schedule_with_ids.csv --output data/2025_schedule_with_ids.csv
      - name: Audit a bounded batch of failed fits
        env:
          P1_AUDIT_OFFSET: ${{ matrix.offset }}
          P1_AUDIT_LIMIT: 1000
        run: python scripts/p1_scipy_failure_audit.py | tee p1-scipy-audit-chunk.log
      - uses: actions/upload-artifact@v4
        with:
          name: p1-scipy-audit-chunk-${{ matrix.chunk }}
          path: |
            p1-scipy-failure-audit-*.csv
            p1-scipy-failure-audit-*.json
            p1-scipy-audit-chunk.log
          if-no-files-found: error
          retention-days: 90

  aggregate-audit:
    name: Merge and validate all SciPy comparisons
    needs: audit-chunk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/lambda-out-of-time-2025
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: p1-scipy-audit-chunk-*
          path: audit-chunks
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: p1-2026-experiment-results
          run-id: 40518879108
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Merge all failed-fit comparisons
        run: python scripts/aggregate_p1_scipy_failure_audit.py | tee p1-scipy-failure-audit-summary.log
      - uses: actions/upload-artifact@v4
        with:
          name: p1-scipy-failure-audit-results
          path: |
            p1-scipy-failure-audit.csv
            p1-scipy-failure-audit-summary.json
            p1-scipy-failure-audit-summary.log
          if-no-files-found: error
          retention-days: 90
