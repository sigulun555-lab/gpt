name: Update J.League toto predictions
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'model.js'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'package.json'
      - 'data/**'
      - '.github/workflows/update-predictions.yml'
permissions:
  contents: write
concurrency:
  group: toto-prediction-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: |
          node --check model.js
          node --check scripts/auto_pipeline.js
          node --check app.js
          npm test
      - name: Fetch data and generate predictions
        id: pipeline
        continue-on-error: true
        run: npm run update
      - name: Upload generated data for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toto-generated-data-${{ github.run_id }}
          path: data/
          if-no-files-found: error
          retention-days: 3
      - name: Commit status and generated data
        id: publish
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'No data changes to publish.'
          else
            git commit -m "chore: refresh toto data and predictions [skip ci]"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
      - name: TEMP DEBUG - gist-dump generated data (Claude verification only, not part of PR #6)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh gist create data/fixtures.json data/status.json data/predictions.json \
            --public=false --desc "toto-lab verification dump run ${{ github.run_id }} (temporary, Claude debug branch)"
      - name: Report unsuccessful pipeline or publish
        if: always() && (steps.pipeline.outcome != 'success' || (github.ref == 'refs/heads/main' && steps.publish.outcome != 'success'))
        run: |
          echo 'Pipeline or data publish failed. Inspect the uploaded toto-generated-data artifact and job logs.'
          exit 1
  deploy:
    if: github.ref == 'refs/heads/main' && always() && needs.update.result != 'cancelled'
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
