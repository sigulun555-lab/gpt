name: Update J.League toto predictions
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'model.js'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'package.json'
      - 'data/**'
      - '.github/workflows/update-predictions.yml'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: toto-prediction-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: |
          node --check model.js
          node --check scripts/auto_pipeline.js
          node --check app.js
          npm test
      - name: Fetch data and generate predictions
        id: pipeline
        continue-on-error: true
        run: npm run update
      - name: Upload generated data for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toto-generated-data-${{ github.run_id }}
          path: data/
          if-no-files-found: error
          retention-days: 3
      - name: Create or update data refresh pull request
        id: publish
        if: steps.pipeline.outcome == 'success' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/toto-data-refresh
          delete-branch: false
          commit-message: 'chore: refresh toto data and predictions'
          title: 'data: refresh J.League toto predictions'
          body: |
            Automated data refresh from the existing J.League toto prediction pipeline.

            - Generated data is proposed on this dedicated branch only.
            - No direct write to main and no automatic merge.
            - Existing prediction/history records are reviewed as a diff before publication.
            - No GitHub Pages deployment is performed by this scheduled data-refresh workflow.
          add-paths: |
            data/**
      - name: Report unsuccessful pipeline or PR creation
        if: always() && (steps.pipeline.outcome != 'success' || (github.ref == 'refs/heads/main' && steps.publish.outcome != 'success'))
        run: |
          echo 'Pipeline or data refresh PR creation failed. Inspect the uploaded toto-generated-data artifact and job logs.'
          exit 1
