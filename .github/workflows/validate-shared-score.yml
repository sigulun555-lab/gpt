name: Validate shared score model
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'model.js'
      - 'tests/**'
      - 'data/team_aliases.json'
      - 'package.json'
permissions:
  contents: read
jobs:
  # Research-only accuracy experiments; no production prediction code is changed.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check model.js
      - run: npm test
      - name: Check historical experiment script syntax
        run: node --check scripts/experiment_toto_ablation_historical.js
      - name: Run reproducible toto 1X2 experiment reports
        run: |
          mkdir -p artifacts/toto-1x2
          node scripts/experiment_toto_model.js > artifacts/toto-1x2/round-1668.json
          node scripts/experiment_toto_ablation.js > artifacts/toto-1x2/ablation.json
          node scripts/experiment_toto_ablation_historical.js > artifacts/toto-1x2/ablation-2025plus2026.json
          node scripts/experiment_toto_v1_recency.js > artifacts/toto-1x2/recency-ablation.json
          node scripts/experiment_toto_v1_league_shrinkage.js > artifacts/toto-1x2/league-shrinkage-ablation.json
          node scripts/experiment_toto_v1_temperature.js > artifacts/toto-1x2/v1-temperature.json
      - name: Upload toto 1X2 experiment results
        uses: actions/upload-artifact@v4
        with:
          name: toto-1x2-model-experiment
          path: artifacts/toto-1x2/
          if-no-files-found: error
          retention-days: 30
      - name: Test against live official toto HTML
        run: node tests/test_live_official.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent benchmark dependencies
        run: python -m pip install numpy scipy
      - name: Run independent GOAL3 benchmark
        run: python verification/goal3_independent/bench.py
      - name: Upload independent GOAL3 benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: independent-goal3-benchmark
          path: verification/goal3_independent/results.json
          if-no-files-found: error
      - name: Test nested GOAL3 validation
        run: python3 -m unittest verification/goal3_independent/test_nested_validation.py
      - name: Run nested GOAL3 validation on real data
        run: python3 verification/goal3_independent/nested_validation.py
      - name: Upload nested validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-goal3-validation-results
          path: verification/goal3_independent/nested_results.json
          if-no-files-found: warn
          retention-days: 30
